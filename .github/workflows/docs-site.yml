name: docs-site

# Manual for now. To publish on every change to docs/, replace the trigger with:
#   on:
#     push:
#       branches: [main]
#       paths: ["docs/**", "mkdocs.yml"]
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force

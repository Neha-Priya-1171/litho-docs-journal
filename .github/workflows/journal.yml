name: journal

on:
  push:
    branches: [main]
    paths: ["journal/**", "team.yml", "tools/**"]
  pull_request:
    paths: ["journal/**", "team.yml", "tools/**"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/lint_journal.py

  indexes:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/build_indexes.py
      - name: Commit regenerated indexes
        run: |
          git config user.name "litho-bot"
          git config user.email "litho-bot@users.noreply.github.com"
          git add journal
          if git diff --cached --quiet; then
            echo "indexes already up to date"
          else
            git commit -m "chore: rebuild journal indexes [skip ci]"
            git pull --rebase
            git push
          fi
